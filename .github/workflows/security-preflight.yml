name: Agent compiled security preflight
on:
  push:
    branches: [ci/security-preflight-20261030]
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            sha: 2d408e314fdb7aed11ad36871d5c08b8c52c38b9
          - label: patch
            sha: 8cd9d33d353a75c0c4b0eb1b6b638adaeb748028
    env:
      TEST_SHA: ${{ matrix.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify tested SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TEST_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Restore public SDK framework packs from their public source
        shell: bash
        run: |
          python - <<'PYTHON'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          configs = ['src/NuGet.Config', 'src/Test/NuGet.Config',
                     'src/Agent.Worker/NuGet.Config', 'src/Agent.Listener/NuGet.Config',
                     'src/Microsoft.VisualStudio.Services.Agent/NuGet.Config']
          for filename in configs:
              tree = ET.parse(filename)
              root = tree.getroot()
              ET.SubElement(root.find('packageSources'), 'add', {
                  'key': 'dotnet-framework-packs', 'value': 'https://api.nuget.org/v3/index.json'})
              mapping = ET.SubElement(root, 'packageSourceMapping')
              original = ET.SubElement(mapping, 'packageSource', {'key': 'restsdk'})
              ET.SubElement(original, 'package', {'pattern': '*'})
              public = ET.SubElement(mapping, 'packageSource', {'key': 'dotnet-framework-packs'})
              for prefix in ['Microsoft.NETCore.App.*', 'Microsoft.AspNetCore.App.*']:
                  ET.SubElement(public, 'package', {'pattern': prefix})
              tree.write(filename, encoding='utf-8', xml_declaration=True)
          print('Framework package versions are unchanged; non-framework packages retain the upstream feed.')
          PYTHON
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          languages: csharp
          build-mode: manual
      - name: Compile the real agent
        working-directory: src
        shell: bash
        run: ./dev.sh layout net10.0 Release linux-x64
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          output: sarif-results
          upload: false
          category: /language:csharp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: codeql-${{ matrix.label }}
          path: sarif-results
          if-no-files-found: warn
